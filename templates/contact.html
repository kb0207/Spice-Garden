{% extends 'base.html' %}
{% block title %}Contact & Feedback | Spice Garden{% endblock %}

{% block content %}
<section class="contact-section" style="max-width: 600px; margin: 40px auto; padding: 20px;">
    <h2 style="text-align: center; color: #3b1f0f;">Contact & Feedback</h2>
    <p style="text-align: center; color: #666; margin-bottom: 25px;">We value your opinion! Submit your feedback below.</p>

    <div id="feedback-alert" style="display:none; padding: 12px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-weight: bold;"></div>

    <form id="feedbackForm">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Enter your name">

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Enter your email">

        <label>Your Rating</label>
        <div class="rating-stars" id="starContainer">
            <span data-rating="1">★</span>
            <span data-rating="2">★</span>
            <span data-rating="3">★</span>
            <span data-rating="4">★</span>
            <span data-rating="5">★</span>
        </div>
        <input type="hidden" id="ratingInput" value="5">

        <label for="message">Message</label>
        <textarea id="message" rows="4" required placeholder="Write your feedback..."></textarea>

        <button type="submit" id="submitBtn">Send Feedback</button>
    </form>
</section>
{% endblock %}

{% block scripts %}
<script>
    // Star Rating Interaction
    let selectedRating = 5;
    const stars = document.querySelectorAll('#starContainer span');
    stars.forEach(star => {
        star.addEventListener('click', () => {
            selectedRating = star.dataset.rating;
            document.getElementById('ratingInput').value = selectedRating;
            stars.forEach(s => {
                s.classList.toggle('active', s.dataset.rating <= selectedRating);
            });
        });
    });

    // AJAX Form Submission
    document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('feedback-alert');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            rating: selectedRating,
            message: document.getElementById('message').value
        };

        try {
            const res = await fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                alertBox.style.display = 'block';
                alertBox.style.backgroundColor = '#d4edda';
                alertBox.style.color = '#155724';
                alertBox.textContent = data.message;
                document.getElementById('feedbackForm').reset();
            } else {
                throw new Error(data.error);
            }
        } catch (err) {
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = '#f8d7da';
            alertBox.style.color = '#721c24';
            alertBox.textContent = 'Failed to send feedback. Please try again.';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Feedback';
        }
    });
</script>
{% endblock %}
